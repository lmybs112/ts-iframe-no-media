    (function ($) {
      // 動態添加 Google 字體連結
      var googleFontLink = document.createElement("link");
      googleFontLink.rel = "preconnect";
      googleFontLink.href = "https://fonts.googleapis.com";
      document.head.appendChild(googleFontLink);

      var googleFontLink2 = document.createElement("link");
      googleFontLink2.rel = "preconnect";
      googleFontLink2.href = "https://fonts.gstatic.com";
      googleFontLink2.crossorigin = "anonymous";
      document.head.appendChild(googleFontLink2);

      var googleFontLink3 = document.createElement("link");
      googleFontLink3.rel = "stylesheet";
      googleFontLink3.href =
        "https://fonts.googleapis.com/css2?family=Chocolate+Classical+Sans&family=Figtree:ital,wght@0,300..900;1,300..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap";
      document.head.appendChild(googleFontLink3);

      // 動態添加自定 CSS
      var customCSS = document.createElement("link");
      customCSS.rel = "stylesheet";
      customCSS.type = "text/css";
      customCSS.href = "./../css/iframe_ai_pd_style.css";
      document.head.appendChild(customCSS);

      $(function () {
        $(window).on("message", function (event) {
          var origin = event.originalEvent.origin;
          // if (origin !== 'https://iframe所在的網址') return; // 避免跨域攻擊
          var data = event.originalEvent.data;
          // 處理從 <iframe> 來的訊息
          if (data.type === "result") {
            if (data.value) {
              $(".ai-pd-container__trigger").addClass(
                "ai-pd-container__trigger--result"
              );
            } else {
              $(".ai-pd-container__trigger").removeClass(
                "ai-pd-container__trigger--result"
              );
            }
          }
          if (data.type === "closeModal") {
            if (data.value) {
              $("#inffits_cblock--overlay").fadeOut();
              hideCheckinBubble();
              $(".ai-pd-container__trigger").toggleClass(
                "ai-pd-container__trigger--search ai-pd-container__trigger--close"
              );
            }
          }
          if (data.type === "checkin:state") {
            renderCheckinBubble(data);
          }
        });

        var checkinRepos = null;
        var checkinAnchor = null;
        var checkinResizeObs = null;
        var checkinPosRaf = null;
        var checkinAnimating = false;
        var checkinAnimTimer = null;

        function cacheCheckinAnchor() {
          var pr = getCheckinAnchorRect();
          if (!pr || pr.width === 0) return false;
          checkinAnchor = {
            top: pr.top,
            left: pr.left,
            width: pr.width,
            centerX: pr.left + pr.width / 2,
          };
          return true;
        }

        function applyCheckinPosition() {
          var bubble = document.getElementById("checkin-bubble");
          if (!bubble || bubble.hasAttribute("hidden") || !checkinAnchor) return;

          var bw = bubble.offsetWidth;
          var bh = bubble.offsetHeight;
          var arrowH = 9;

          var left = checkinAnchor.centerX - bw / 2;
          left = Math.max(8, Math.min(left, window.innerWidth - bw - 8));

          bubble.style.left = left + "px";
          bubble.style.top = checkinAnchor.top - bh - arrowH + "px";

          var arrowX = checkinAnchor.centerX - left;
          arrowX = Math.max(18, Math.min(arrowX, bw - 18));
          bubble.style.setProperty("--arrow-x", arrowX + "px");
        }

        function scheduleCheckinPosition() {
          if (checkinPosRaf) return;
          checkinPosRaf = requestAnimationFrame(function () {
            checkinPosRaf = null;
            applyCheckinPosition();
          });
        }

        // 動態對齊：讓打卡卡片位於彈窗正上方中央，箭頭指向彈窗中心
        function positionCheckinBubble() {
          if (cacheCheckinAnchor()) {
            applyCheckinPosition();
          }
        }

        function ensureCheckinResizeObserver() {
          var bubble = document.getElementById("checkin-bubble");
          if (!bubble || checkinResizeObs) return;
          checkinResizeObs = new ResizeObserver(function () {
            scheduleCheckinPosition();
          });
          checkinResizeObs.observe(bubble);
        }

        function startCheckinAnchorPoll() {
          if (checkinRepos) clearInterval(checkinRepos);
          checkinRepos = setInterval(function () {
            if (!checkinAnimating) positionCheckinBubble();
          }, 1500);
        }

        function finishCheckinCollapseAnim() {
          var bubble = document.getElementById("checkin-bubble");
          if (!bubble || !checkinAnimating) return;
          bubble.classList.remove("is-animating");
          checkinAnimating = false;
          if (checkinAnimTimer) {
            clearTimeout(checkinAnimTimer);
            checkinAnimTimer = null;
          }
          positionCheckinBubble();
        }

        function startCheckinCollapseAnim() {
          var bubble = document.getElementById("checkin-bubble");
          if (!bubble) return;

          cacheCheckinAnchor();
          checkinAnimating = true;
          bubble.classList.add("is-animating");

          var collapse = bubble.querySelector(".checkin-card__collapse");
          if (collapse) {
            collapse.addEventListener("transitionend", onCollapseEnd);
          }
          if (checkinAnimTimer) clearTimeout(checkinAnimTimer);
          checkinAnimTimer = setTimeout(finishCheckinCollapseAnim, 460);

          function onCollapseEnd(e) {
            if (e.propertyName !== "grid-template-rows") return;
            collapse.removeEventListener("transitionend", onCollapseEnd);
            finishCheckinCollapseAnim();
          }
        }

        // 取得 iframe 內實際可見彈窗位置（桌面版 cblock 比可見卡片高，不能直接用它）
        function getCheckinAnchorRect() {
          var fallback = document.getElementById("inffits_cblock");
          var iframe = document.getElementById("inffits_tryon_window");
          if (!iframe) {
            return fallback ? fallback.getBoundingClientRect() : null;
          }

          try {
            var doc = iframe.contentDocument || iframe.contentWindow.document;
            if (!doc || !doc.body) {
              return fallback ? fallback.getBoundingClientRect() : null;
            }

            var iframeRect = iframe.getBoundingClientRect();
            var best = null;
            var bestArea = 0;
            var candidates = doc.querySelectorAll(
              "#intro-page, #container-recom, .container.back, #loadingbar_recom, .container.update_delete, .container.mbinfo"
            );

            for (var i = 0; i < candidates.length; i++) {
              var el = candidates[i];
              var cs = doc.defaultView.getComputedStyle(el);
              if (cs.display === "none" || cs.visibility === "hidden") continue;
              if (parseFloat(cs.opacity) < 0.05) continue;

              var r = el.getBoundingClientRect();
              if (r.width < 80 || r.height < 80) continue;

              var area = r.width * r.height;
              if (area > bestArea) {
                bestArea = area;
                best = {
                  top: iframeRect.top + r.top,
                  left: iframeRect.left + r.left,
                  width: r.width,
                  height: r.height,
                  right: iframeRect.left + r.right,
                  bottom: iframeRect.top + r.bottom,
                };
              }
            }

            if (best) return best;
          } catch (_) {}

          return fallback ? fallback.getBoundingClientRect() : null;
        }

        function applyCheckinCollapsed() {
          var collapsed = false;
          try {
            collapsed = localStorage.getItem("INFS_CHECKIN_COLLAPSED") === "1";
          } catch (_) {}
          $("#checkin-bubble").toggleClass("is-collapsed", collapsed);
          $("#checkin-toggle").attr("aria-expanded", collapsed ? "false" : "true");
        }

        $(document).on("click", "#checkin-toggle", function () {
          var collapsed = !$("#checkin-bubble").hasClass("is-collapsed");
          $("#checkin-bubble").toggleClass("is-collapsed", collapsed);
          $(this).attr("aria-expanded", collapsed ? "false" : "true");
          try {
            localStorage.setItem("INFS_CHECKIN_COLLAPSED", collapsed ? "1" : "0");
          } catch (_) {}
          startCheckinCollapseAnim();
        });

        function showCheckinBubble() {
          $("#checkin-bubble").removeAttr("hidden");
          applyCheckinCollapsed();
          ensureCheckinResizeObserver();
          positionCheckinBubble();
          $("#checkin-bubble").addClass("checkin-bubble--visible");

          var iframe = document.getElementById("inffits_tryon_window");
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: "checkin:request" }, "*");
          }

          startCheckinAnchorPoll();
        }

        function hideCheckinBubble() {
          $("#checkin-bubble")
            .removeClass("checkin-bubble--visible")
            .attr("hidden", true);
          if (checkinRepos) {
            clearInterval(checkinRepos);
            checkinRepos = null;
          }
          if (checkinResizeObs) {
            checkinResizeObs.disconnect();
            checkinResizeObs = null;
          }
          if (checkinAnimTimer) {
            clearTimeout(checkinAnimTimer);
            checkinAnimTimer = null;
          }
          checkinAnimating = false;
        }

        window.addEventListener("resize", positionCheckinBubble);

        var checkinLastData = null;

            '<svg viewBox="0 0 48 48" fill="none" aria-hidden="true">' +
            '<path d="M7 30h22.5V16H7v14Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>' +
            '<path d="M29.5 20.5H36l5 7.5V34H29.5" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>' +
            '<circle cx="15" cy="34.5" r="3.2" stroke="currentColor" stroke-width="2.2"/>' +
            '<circle cx="35.5" cy="34.5" r="3.2" stroke="currentColor" stroke-width="2.2"/>' +
            '<path d="M7 22h22.5M12 26h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
            "</svg>",
        };

        function getRewardPrizeType(prize) {
          var label = (prize && prize.label) || "";
          if (/免運/.test(label)) return "shipping";
          if (/禮|贈|盒|周邊/.test(label)) return "gift";
          return "coupon";
        }

        function renderRewardResultIcon(prize) {
          var type = getRewardPrizeType(prize);
          $("#reward-result-visual")
            .attr(
              "class",
              "reward-modal__result-visual reward-modal__result-visual--" + type
            )
            .find(".reward-modal__result-icon")
            .html(REWARD_PRIZE_ICONS[type] || REWARD_PRIZE_ICONS.coupon);
        }

        function parentPrizeKey(brand, day) {
          return "INFS_GIFT_PRIZE_" + brand + "_" + day;
        }

        function saveParentGiftPrize(brand, day, prize) {
          if (!brand || !day || !prize || !prize.label) return;
          var stored = enrichPrizeWithCode(prize, day);
          try {
            localStorage.setItem(
              parentPrizeKey(brand, day),
              JSON.stringify({
                label: stored.label,
                desc: stored.desc || "",
                code: stored.code || "",
              })
            );
            checkinGiftPrizesCache[brand + ":" + day] = stored;
          } catch (_) {}
        }

        function enrichPrizeWithCode(prize, day) {
          if (!prize) return prize;
          if (prize.code) return prize;
          var pool = day && REWARD_POOLS[day];
          if (!pool) return prize;
          for (var i = 0; i < pool.length; i++) {
            if (pool[i].label === prize.label) {
              return {
                label: prize.label,
                desc: prize.desc || pool[i].desc || "",
                code: pool[i].code || "",
              };
            }
          }
          return prize;
        }

        function resetCopyCodeButton() {
          var $btn = $("#reward-copy-code");
          $btn.text("複製優惠碼").removeClass("is-copied");
        }

        function persistRewardPrize() {
          if (
            rewardViewMode ||
            !rewardCurrentDay ||
            !rewardWinPrize ||
            rewardPrizePersisted
          ) {
            return;
          }

          rewardPrizePersisted = true;
          var brand = checkinLastData && checkinLastData.brand;
          saveParentGiftPrize(brand, rewardCurrentDay, rewardWinPrize);

          var iframe = document.getElementById("inffits_tryon_window");
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage(
              {
                type: "checkin:claim-gift",
                day: rewardCurrentDay,
                prize: enrichPrizeWithCode(rewardWinPrize, rewardCurrentDay),
              },
              "*"
            );
          }
        }

        function showCopyCodeFeedback() {
          var $btn = $("#reward-copy-code");
          $btn.text("已複製").addClass("is-copied");
          setTimeout(resetCopyCodeButton, 1600);
        }

        function copyRewardCode() {
          var code = $("#reward-result-code").text();
          if (!code) return;

          function onSuccess() {
            showCopyCodeFeedback();
          }

          function fallbackCopy() {
            var ta = document.createElement("textarea");
            ta.value = code;
            ta.setAttribute("readonly", "");
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
              onSuccess();
            } catch (_) {}
            document.body.removeChild(ta);
          }

          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(onSuccess).catch(fallbackCopy);
          } else {
            fallbackCopy();
          }
        }

        function getGiftPrize(day) {
          var brand = checkinLastData && checkinLastData.brand;
          var fromStamp = null;

          if (checkinLastData && checkinLastData.stamps) {
            for (var i = 0; i < checkinLastData.stamps.length; i++) {
              var s = checkinLastData.stamps[i];
              if (s.day === day && s.prize && s.prize.label) {
                fromStamp = s.prize;
                break;
              }
            }
          }

          if (fromStamp) return enrichPrizeWithCode(fromStamp, day);

          if (brand && checkinGiftPrizesCache[brand + ":" + day]) {
            return enrichPrizeWithCode(checkinGiftPrizesCache[brand + ":" + day], day);
          }

          if (brand) {
            try {
              var raw = localStorage.getItem(parentPrizeKey(brand, day));
              if (raw) return enrichPrizeWithCode(JSON.parse(raw), day);
            } catch (_) {}
          }

          if (checkinLastData && checkinLastData.giftPrizes) {
            var gp = checkinLastData.giftPrizes[String(day)] || checkinLastData.giftPrizes[day];
            if (gp && gp.label) return enrichPrizeWithCode(gp, day);
          }

          return null;
        }

        function renderCheckinBubble(data) {
          checkinLastData = data;
          if (data.brand && data.giftPrizes) {
            Object.keys(data.giftPrizes).forEach(function (day) {
              var p = data.giftPrizes[day];
              if (p && p.label) {
                checkinGiftPrizesCache[data.brand + ":" + day] = p;
              }
            });
          }
          $("#checkin-streak-text").text(data.streak || 0);

          var stampsHtml = (data.stamps || [])
            .map(function (s) {
              var cls = "checkin-dot";
              if (s.filled) cls += " checkin-dot--filled";
              if (s.gift) cls += " checkin-dot--gift";
              if (s.claimable) cls += " checkin-dot--claimable";
              if (s.viewable) cls += " checkin-dot--viewable";
              if (s.claimed) cls += " checkin-dot--claimed";

              var inner = "";
              if (s.gift) {
                inner =
                  '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
                  '<path d="M2.5 4.8h7v4.4a.6.6 0 0 1-.6.6H3.1a.6.6 0 0 1-.6-.6V4.8Z" stroke="currentColor" stroke-width="0.9"/>' +
                  '<path d="M1.6 3.3h8.8v1.5H1.6zM6 3.3v6.5" stroke="currentColor" stroke-width="0.9" stroke-linejoin="round"/>' +
                  '<path d="M6 3.3S5.4 1.6 4.4 1.9c-.9.3-.5 1.4.4 1.4M6 3.3s.6-1.7 1.6-1.4c.9.3.5 1.4-.4 1.4" stroke="currentColor" stroke-width="0.9" stroke-linecap="round"/>' +
                  "</svg>";
              } else if (s.filled) {
                inner =
                  '<svg viewBox="0 0 10 8" fill="none" aria-hidden="true">' +
                  '<path d="M1 4.2 3.6 6.8 9 1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
                  "</svg>";
              } else {
                inner =
                  '<span class="checkin-dot__num" aria-hidden="true">' +
                  s.day +
                  "</span>";
              }

              if (s.claimable || s.viewable) {
                var ariaLabel = s.claimable
                  ? "領取第 " + s.day + " 天禮物"
                  : "查看第 " + s.day + " 天優惠";
                var dataAttrs =
                  ' data-gift-day="' +
                  s.day +
                  '"';
                if (s.prize) {
                  dataAttrs +=
                    ' data-prize-label="' +
                    String(s.prize.label).replace(/"/g, "&quot;") +
                    '" data-prize-desc="' +
                    String(s.prize.desc || "").replace(/"/g, "&quot;") +
                    '"';
                }
                return (
                  '<button type="button" class="' +
                  cls +
                  '"' +
                  dataAttrs +
                  ' aria-label="' +
                  ariaLabel +
                  '">' +
                  inner +
                  "</button>"
                );
              }
              return '<span class="' + cls + '">' + inner + "</span>";
            })
            .join("");
          $("#checkin-dots").html(stampsHtml);

          $("#checkin-status").text(data.status || "");
          $("#checkin-bubble").toggleClass("is-done", !!data.doneToday);
          $("#checkin-bubble").toggleClass("has-claimable-gift", !!data.pendingGift);

          if (data.toast && data.toast.message) {
            showCheckinToast(data.toast);
          }

          if (data.toast && data.toast.openWheel && data.toast.day) {
            setTimeout(function () {
              openRewardWheel(data.toast.day);
            }, 700);
          }

          if (typeof positionCheckinBubble === "function") {
            positionCheckinBubble();
          }
          updateCheckinDebugPanel();
        }

        function buildRewardWheelSlots(pool, revealed) {
          var count = pool.length;
          var step = 360 / count;
          return pool
            .map(function (item, i) {
              var angle = i * step;
              var type = getRewardPrizeType(item);
              var inner;
              if (revealed) {
                inner =
                  '<span class="reward-wheel__slot-label">' +
                  item.label +
                  "</span>" +
                  '<span class="reward-wheel__slot-desc">' +
                  item.desc +
                  "</span>";
              } else {
                inner =
                  '<div class="reward-wheel__slot-mystery-wrap">' +
                  '<span class="reward-wheel__slot-mystery-icon" aria-hidden="true">' +
                  REWARD_PRIZE_ICONS[type] +
                  "</span>" +
                  "</div>";
              }
              return (
                '<div class="reward-wheel__slot" style="--angle:' +
                angle +
                "deg;--slot-i:" +
                i +
                '">' +
                '<div class="reward-wheel__slot-inner' +
                (revealed
                  ? ""
                  : " reward-wheel__slot-inner--mystery reward-wheel__slot-inner--" +
                    type) +
                '">' +
                inner +
                "</div></div>"
              );
            })
            .join("");
        }

        function showRewardModal($modal) {
          $modal.removeAttr("hidden");
          void $modal[0].offsetHeight;
          $modal.addClass("reward-modal--visible");
        }

        function openRewardWheel(day) {
          var pool = REWARD_POOLS[day];
          if (!pool || rewardWheelSpinning) return;

          rewardViewMode = false;
          rewardCurrentDay = day;
          rewardWinPrize = null;
          rewardPrizePersisted = false;

          var $modal = $("#checkin-reward-modal");
          $("#reward-modal-title").text(REWARD_TITLES[day] || "專屬優惠轉盤");
          $(".reward-modal__sub").text("點擊中心按鈕，抽取你的專屬優惠");
          $("#reward-result-label").text("恭喜獲得");
          $("#reward-modal-result").removeClass("reward-modal__result--view");
          $("#reward-wheel-ring").html(buildRewardWheelSlots(pool, false)).css({
            transform: "rotate(0deg)",
            transition: "none",
          });
          $("#reward-wheel-ring").removeData("rotation");
          $(".reward-wheel").addClass("reward-wheel--ready");
          $("#reward-modal-result").attr("hidden", true);
          $(".reward-wheel__stage").removeAttr("hidden");
          $("#reward-wheel-spin")
            .prop("disabled", false)
            .find(".reward-wheel__spin-text")
            .text("抽優惠");
          resetCopyCodeButton();

          showRewardModal($modal);
        }

        function openRewardView(day, prize) {
          rewardViewMode = true;
          rewardCurrentDay = day;
          rewardWinPrize = prize;

          var $modal = $("#checkin-reward-modal");
          $("#reward-modal-title").text(REWARD_TITLES[day] || "我的優惠");
          $(".reward-modal__sub").text("以下為你已獲得的優惠券");
          $("#reward-result-label").text("你的優惠");
          $(".reward-wheel__stage").attr("hidden", true);
          showRewardResult(prize);

          showRewardModal($modal);
        }

        function closeRewardWheel() {
          var $modal = $("#checkin-reward-modal");
          $modal.removeClass("reward-modal--visible");
          setTimeout(function () {
            $modal.attr("hidden", true);
            rewardWheelSpinning = false;
            rewardViewMode = false;
            rewardCurrentDay = null;
            rewardPrizePersisted = false;
          }, 260);
        }

        function spinRewardWheel() {
          if (rewardWheelSpinning || !rewardCurrentDay) return;

          var pool = REWARD_POOLS[rewardCurrentDay];
          if (!pool) return;

          rewardWheelSpinning = true;
          $(".reward-wheel").addClass("reward-wheel--spinning");
          $("#reward-wheel-spin")
            .prop("disabled", true)
            .find(".reward-wheel__spin-text")
            .text("抽取中");

          var winIndex = Math.floor(Math.random() * pool.length);
          rewardWinPrize = pool[winIndex];

          var count = pool.length;
          var segment = 360 / count;
          var ring = document.getElementById("reward-wheel-ring");
          var current = parseFloat($(ring).data("rotation")) || 0;
          // 格位角度為 i * segment（0° 在頂部指針處），停點需讓中獎格中心對準指針
          var stopAngle = (360 - winIndex * segment) % 360;
          var currentMod = ((current % 360) + 360) % 360;
          var delta = (stopAngle - currentMod + 360) % 360;
          var target = current + 360 * 5 + delta;

          $(ring).data("rotation", target);
          ring.style.transition =
            "transform 3.2s cubic-bezier(0.17, 0.67, 0.12, 0.99)";
          ring.style.transform = "rotate(" + target + "deg)";

          ring.addEventListener(
            "transitionend",
            function onEnd(e) {
              if (e.propertyName !== "transform") return;
              ring.removeEventListener("transitionend", onEnd);
              showRewardResult(rewardWinPrize);
            },
            { once: false }
          );
        }

        function showRewardResult(prize) {
          var enriched = enrichPrizeWithCode(prize, rewardCurrentDay);
          renderRewardResultIcon(enriched);
          $(".reward-modal__sub").text(
            rewardViewMode
              ? "以下為你已獲得的優惠券"
              : "已為你抽出專屬優惠"
          );
          $("#reward-result-text").text(enriched.label);
          $("#reward-result-desc").text(enriched.desc || "");
          $("#reward-result-code").text(enriched.code || "");
          if (enriched.code) {
            $("#reward-code-wrap").removeAttr("hidden");
          } else {
            $("#reward-code-wrap").attr("hidden", true);
          }
          resetCopyCodeButton();
          if (rewardViewMode) {
            $("#reward-modal-result").addClass("reward-modal__result--view");
          } else {
            $("#reward-modal-result").removeClass("reward-modal__result--view");
            persistRewardPrize();
            rewardWheelSpinning = false;
            $(".reward-wheel").removeClass("reward-wheel--spinning");
          }
          $(".reward-wheel__stage").attr("hidden", true);
          $("#reward-modal-result").removeAttr("hidden");
        }

        $(document).on("click", ".checkin-dot--claimable", function (e) {
          e.stopPropagation();
          var day = parseInt($(this).attr("data-gift-day"), 10);
          if (day) openRewardWheel(day);
        });

        $(document).on("click", ".checkin-dot--viewable", function (e) {
          e.stopPropagation();
          var day = parseInt($(this).attr("data-gift-day"), 10);
          if (!day) return;
          var prize = getGiftPrize(day);
          if (!prize) {
            openRewardWheel(day);
            return;
          }
          openRewardView(day, prize);
        });

        $(document).on("click", "#reward-wheel-spin", spinRewardWheel);
        $(document).on("click", "#reward-copy-code", copyRewardCode);
        $(document).on("click", "#checkin-reward-close, .reward-modal__backdrop", function () {
          if (rewardWheelSpinning) return;
          closeRewardWheel();
        });

        function showCheckinToast(toast) {
          var $t = $("#checkin-toast");
          if (checkinToastTimer) clearTimeout(checkinToastTimer);
          $t.text(toast.message)
            .toggleClass("is-gift", !!toast.gift)
            .addClass("is-visible");
          checkinToastTimer = setTimeout(function () {
            $t.removeClass("is-visible");
          }, 2600);
        }

        function checkinDebugPad2(n) {
          return String(n).padStart(2, "0");
        }

        function checkinDebugDateStr(offsetDays) {
          var d = new Date();
          d.setDate(d.getDate() + (offsetDays || 0));
          return (
            d.getFullYear() +
            "-" +
            checkinDebugPad2(d.getMonth() + 1) +
            "-" +
            checkinDebugPad2(d.getDate())
          );
        }

        function checkinDebugStorageKey(brand) {
          return "INFS_CHECKIN_" + brand;
        }

        function getCheckinDebugBrand() {
          if (checkinLastData && checkinLastData.brand) return checkinLastData.brand;
          if (window.__checkinDebugBrand) return window.__checkinDebugBrand;
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var key = localStorage.key(i);
              if (
                key &&
                key.indexOf("INFS_CHECKIN_") === 0 &&
                key !== "INFS_CHECKIN_COLLAPSED"
              ) {
                return key.replace("INFS_CHECKIN_", "");
              }
            }
          } catch (_) {}
          return "";
        }

        function loadCheckinDebugState() {
          var brand = getCheckinDebugBrand();
          if (!brand) return null;
          try {
            var raw = localStorage.getItem(checkinDebugStorageKey(brand));
            if (raw) {
              var s = JSON.parse(raw);
              if (!s.claimedGifts) s.claimedGifts = [];
              if (!s.giftPrizes) s.giftPrizes = {};
              return s;
            }
          } catch (_) {}
          return {
            streak: 0,
            cycle: 0,
            lastDate: null,
            claimedGifts: [],
            giftPrizes: {},
          };
        }

        function saveCheckinDebugState(state) {
          var brand = getCheckinDebugBrand();
          if (!brand || !state) return false;
          try {
            localStorage.setItem(
              checkinDebugStorageKey(brand),
              JSON.stringify(state)
            );
          } catch (_) {
            return false;
          }
          refreshCheckinDebugState();
          return true;
        }

        function clearCheckinDebugGiftPrizes(brand) {
          if (!brand) return;
          [3, 5, 7].forEach(function (day) {
            try {
              localStorage.removeItem(parentPrizeKey(brand, day));
            } catch (_) {}
            delete checkinGiftPrizesCache[brand + ":" + day];
          });
        }

        function refreshCheckinDebugState() {
          var iframe = document.getElementById("inffits_tryon_window");
          if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage({ type: "checkin:request" }, "*");
          }
          updateCheckinDebugPanel();
        }

        function updateCheckinDebugPanel() {
          var brand = getCheckinDebugBrand();
          if (!brand) {
            $("#checkin-debug-status").text("尚未載入打卡狀態\n請先傳送參數到 Iframe");
            return;
          }
          var state = loadCheckinDebugState();
          var today = checkinDebugDateStr(0);
          var lines = [
            "brand: " + brand,
            "cycle: " + (state.cycle || 0) + " / 7",
            "streak: " + (state.streak || 0),
            "lastDate: " + (state.lastDate || "—"),
            "doneToday: " + (state.lastDate === today ? "是" : "否"),
            "claimedGifts: " + JSON.stringify(state.claimedGifts || []),
            "giftPrizes: " + JSON.stringify(state.giftPrizes || {}),
          ];
          $("#checkin-debug-status").text(lines.join("\n"));
          $("#checkin-debug-day-input").val(state.cycle || 0);
        }

        function triggerCheckinDebugMarkComplete() {
          var iframe = document.getElementById("inffits_tryon_window");
          if (!iframe || !iframe.contentWindow) return;
          var win = iframe.contentWindow;
          if (typeof win.markCheckinComplete === "function") {
            win.markCheckinComplete();
          } else {
            refreshCheckinDebugState();
          }
        }

        $(document).on("click", "#checkin-debug-toggle", function () {
          var $body = $("#checkin-debug-body");
          var open = $body.attr("hidden") != null;
          $body.attr("hidden", open ? null : true);
          $(this).attr("aria-expanded", open ? "true" : "false");
          if (open) updateCheckinDebugPanel();
        });

        $(document).on("click", "#checkin-debug-trigger", triggerCheckinDebugMarkComplete);

        $(document).on("click", "#checkin-debug-allow-retoday", function () {
          var state = loadCheckinDebugState();
          if (!state) return;
          state.lastDate = checkinDebugDateStr(-1);
          saveCheckinDebugState(state);
        });

        $(document).on("click", "#checkin-debug-plus-day", function () {
          var state = loadCheckinDebugState();
          if (!state) return;
          state.cycle = Math.min(7, (state.cycle || 0) + 1);
          state.streak = (state.streak || 0) + 1;
          state.lastDate = checkinDebugDateStr(0);
          saveCheckinDebugState(state);
        });

        $(document).on("click", "#checkin-debug-undo-today", function () {
          var state = loadCheckinDebugState();
          if (!state) return;
          var today = checkinDebugDateStr(0);
          if (state.lastDate === today) {
            state.cycle = Math.max(0, (state.cycle || 0) - 1);
            state.streak = Math.max(0, (state.streak || 0) - 1);
            state.lastDate = checkinDebugDateStr(-1);
            saveCheckinDebugState(state);
          }
        });

        $(document).on("click", "#checkin-debug-set-day", function () {
          var state = loadCheckinDebugState();
          if (!state) return;
          var day = parseInt($("#checkin-debug-day-input").val(), 10);
          if (isNaN(day)) day = 0;
          state.cycle = Math.max(0, Math.min(7, day));
          state.lastDate = checkinDebugDateStr(0);
          saveCheckinDebugState(state);
        });

        $(document).on("click", "#checkin-debug-clear-gifts", function () {
          var brand = getCheckinDebugBrand();
          var state = loadCheckinDebugState();
          if (!brand || !state) return;
          state.claimedGifts = [];
          state.giftPrizes = {};
          clearCheckinDebugGiftPrizes(brand);
          saveCheckinDebugState(state);
        });

        $(document).on("click", "#checkin-debug-reset", function () {
          var brand = getCheckinDebugBrand();
          if (!brand) return;
          if (!window.confirm("確定重置「" + brand + "」的打卡資料？")) return;
          try {
            localStorage.removeItem(checkinDebugStorageKey(brand));
          } catch (_) {}
          clearCheckinDebugGiftPrizes(brand);
          refreshCheckinDebugState();
        });

        // 添加 html template
        var aiSearchPdTemplate = `
